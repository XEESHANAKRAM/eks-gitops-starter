<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="770" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="32" font-size="22" font-weight="bold" fill="#1a1a1a">eks-gitops-starter — Architecture</text>
  <text x="20" y="56" font-size="14" fill="#555555">AWS us-east-1 (default) · EKS 1.31 · Terraform + ArgoCD GitOps + Prometheus / Grafana · ~$180–195/mo</text>

  <!-- ===== Left column: laptop ===== -->
  <rect x="20" y="90" width="280" height="100" rx="6" fill="#ebf5fb" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="35" y="116" font-size="15" font-weight="bold" fill="#1a1a1a">Your laptop</text>
  <text x="35" y="140" font-size="13" fill="#333333">terraform · kubectl · helm · docker</text>
  <text x="35" y="162" font-size="13" fill="#333333">aws configure (credentials)</text>
  <text x="35" y="182" font-size="13" fill="#333333">git clone + push</text>

  <!-- ===== Left column: GitHub ===== -->
  <rect x="20" y="220" width="280" height="170" rx="6" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="35" y="246" font-size="14" font-weight="bold" fill="#ffffff">GitHub — eks-gitops-starter</text>
  <text x="35" y="272" font-size="13" fill="#e6e6e6">Terraform code (terraform/)</text>
  <text x="35" y="294" font-size="13" fill="#e6e6e6">K8s manifests (kubernetes/)</text>
  <text x="35" y="316" font-size="13" fill="#e6e6e6">ArgoCD apps (applications/)</text>
  <text x="35" y="338" font-size="13" fill="#e6e6e6">Demo app (apps/demo-app/)</text>
  <text x="35" y="364" font-size="13" fill="#e6e6e6">CI: fmt · validate · tfsec · Trivy</text>

  <!-- ===== Left column: GHCR ===== -->
  <rect x="20" y="420" width="280" height="90" rx="6" fill="#f0f0f0" stroke="#24292f" stroke-width="1.5"/>
  <text x="35" y="446" font-size="15" font-weight="bold" fill="#1a1a1a">GHCR</text>
  <text x="35" y="470" font-size="13" fill="#333333">ghcr.io/xeeshanakram/</text>
  <text x="35" y="492" font-size="13" fill="#333333">demo-app:0.1.0</text>

  <!-- ===== Legend ===== -->
  <rect x="20" y="530" width="280" height="160" rx="6" fill="#f8f9fa" stroke="#999999" stroke-width="1"/>
  <text x="35" y="556" font-size="13" font-weight="bold" fill="#1a1a1a">Flows</text>
  <text x="35" y="578" font-size="11" fill="#333333">Laptop → GitHub: git push</text>
  <text x="35" y="596" font-size="11" fill="#333333">GitHub → EKS: terraform apply</text>
  <text x="35" y="614" font-size="11" fill="#333333">GitHub → ArgoCD: syncs manifests</text>
  <text x="35" y="632" font-size="11" fill="#333333">GHCR → EKS: demo-app image pull</text>
  <text x="35" y="650" font-size="11" fill="#333333">ArgoCD → demo-app: deploys</text>
  <text x="35" y="668" font-size="11" fill="#333333">Prometheus → demo-app: /metrics</text>
  <text x="35" y="686" font-size="11" fill="#333333">Nodes → NAT Gateway: outbound</text>

  <!-- ===== AWS container ===== -->
  <rect x="360" y="90" width="820" height="600" rx="8" fill="#fff8e6" stroke="#ff9900" stroke-width="2"/>
  <text x="380" y="118" font-size="16" font-weight="bold" fill="#1a1a1a">AWS — us-east-1</text>

  <!-- VPC -->
  <rect x="380" y="130" width="780" height="400" rx="6" fill="#ffffff" stroke="#ff9900" stroke-width="1.5"/>
  <text x="395" y="155" font-size="14" font-weight="bold" fill="#1a1a1a">VPC 10.0.0.0/16 — 3 AZs</text>

  <!-- Public subnets -->
  <rect x="400" y="165" width="740" height="95" rx="6" fill="#e8f4fd" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="415" y="190" font-size="13" font-weight="bold" fill="#1a1a1a">Public subnets (3 AZs)</text>
  <rect x="420" y="200" width="220" height="45" rx="4" fill="#ffffff" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="530" y="228" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">NAT Gateway (×1, outbound)</text>
  <rect x="660" y="200" width="240" height="45" rx="4" fill="#ffffff" stroke="#2e86c1" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="780" y="228" font-size="13" fill="#333333" text-anchor="middle">LoadBalancer (optional)</text>

  <!-- Private subnets -->
  <rect x="400" y="280" width="740" height="230" rx="6" fill="#f4f6f7" stroke="#5d6d7e" stroke-width="1.5"/>
  <text x="415" y="305" font-size="13" font-weight="bold" fill="#1a1a1a">Private subnets (3 AZs)</text>

  <!-- EKS cluster -->
  <rect x="420" y="315" width="700" height="180" rx="6" fill="#eaf2fb" stroke="#326ce5" stroke-width="2"/>
  <text x="435" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">EKS Cluster — Kubernetes 1.31 · 2× t3.medium nodes</text>
  <text x="435" y="360" font-size="12" fill="#555555">API endpoint: public (kubectl from your laptop) · nodes in private subnets, no public IPs</text>

  <!-- ArgoCD namespace -->
  <rect x="440" y="370" width="210" height="110" rx="4" fill="#ffffff" stroke="#ef7b4d" stroke-width="1.5"/>
  <text x="455" y="395" font-size="14" font-weight="bold" fill="#1a1a1a">ArgoCD</text>
  <text x="455" y="417" font-size="12" fill="#333333">argocd namespace</text>
  <text x="455" y="437" font-size="12" fill="#333333">syncs manifests from Git</text>
  <text x="455" y="457" font-size="12" fill="#333333">auto-sync · prune · self-heal</text>

  <!-- demo-app namespace -->
  <rect x="670" y="370" width="210" height="110" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="685" y="395" font-size="14" font-weight="bold" fill="#1a1a1a">demo-app ×2</text>
  <text x="685" y="417" font-size="12" fill="#333333">apps namespace</text>
  <text x="685" y="437" font-size="12" fill="#333333">Flask · :8080 · Service :80</text>
  <text x="685" y="457" font-size="12" fill="#333333">image: demo-app:0.1.0</text>

  <!-- Monitoring namespace -->
  <rect x="900" y="370" width="200" height="110" rx="4" fill="#ffffff" stroke="#e6522c" stroke-width="1.5"/>
  <text x="912" y="395" font-size="13" font-weight="bold" fill="#1a1a1a">Prometheus + Grafana</text>
  <text x="912" y="417" font-size="12" fill="#333333">monitoring namespace</text>
  <text x="912" y="437" font-size="12" fill="#333333">scrapes demo-app /metrics</text>
  <text x="912" y="457" font-size="12" fill="#333333">alerts + dashboard</text>

  <!-- IAM -->
  <rect x="380" y="550" width="780" height="120" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="1.5"/>
  <text x="395" y="578" font-size="14" font-weight="bold" fill="#1a1a1a">IAM</text>
  <text x="395" y="602" font-size="13" fill="#333333">IRSA roles: EBS CSI · ArgoCD Image Updater (ECR read-only)</text>
  <text x="395" y="626" font-size="13" fill="#333333">GitHub OIDC role: CI can run terraform plan — never apply (read-only)</text>
  <text x="395" y="650" font-size="13" fill="#333333">EKS access entries (API auth mode) — cluster creator is admin</text>

  <!-- ===== Arrows ===== -->
  <!-- Laptop -> GitHub (git push) -->
  <line x1="160" y1="190" x2="160" y2="218" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- GitHub -> EKS (terraform apply) -->
  <line x1="300" y1="265" x2="418" y2="325" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- GitHub -> ArgoCD (syncs manifests) -->
  <line x1="300" y1="335" x2="438" y2="413" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- GHCR -> EKS (image pull) -->
  <line x1="300" y1="465" x2="418" y2="450" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- EKS -> NAT (outbound) -->
  <line x1="640" y1="315" x2="640" y2="247" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ArgoCD -> demo-app (deploys) -->
  <line x1="650" y1="425" x2="668" y2="425" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Monitoring -> demo-app (scrapes /metrics) -->
  <line x1="900" y1="445" x2="882" y2="445" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="20" y="722" font-size="12" fill="#555555">Defaults: us-east-1 · EKS 1.31 · VPC 10.0.0.0/16 · 2× t3.medium · 1 NAT gateway · ~$180–195/mo — see docs/cost.md.</text>
  <text x="20" y="744" font-size="12" fill="#555555">This repo has never been deployed to AWS; the diagram shows what scripts/bootstrap.sh creates. Live screenshots: docs/screenshots/README.md.</text>
</svg>
