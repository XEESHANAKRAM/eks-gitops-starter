apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  demo-app.json: |
    {
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(demo_app_http_requests_total[5m]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ],
          "title": "HTTP requests / sec",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(demo_app_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "p95 latency",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"demo-app-.*\", namespace=\"apps\"}[5m]))",
              "legendFormat": "cpu cores",
              "refId": "A"
            }
          ],
          "title": "Pod CPU",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{pod=~\"demo-app-.*\", namespace=\"apps\"}) / 1024 / 1024",
              "legendFormat": "MiB",
              "refId": "A"
            }
          ],
          "title": "Pod memory",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": [
        "demo-app",
        "eks-gitops-starter"
      ],
      "timezone": "browser",
      "title": "Demo App",
      "uid": "demo-app",
      "version": 1
    }
