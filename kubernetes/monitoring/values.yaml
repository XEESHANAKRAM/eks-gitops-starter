# kube-prometheus-stack Helm values (chart: prometheus-community/kube-prometheus-stack).
# Install with: helm install prometheus prometheus-community/kube-prometheus-stack \
#   -n monitoring -f kubernetes/monitoring/values.yaml
#
# Grafana login: user `admin`, password from the generated secret:
#   kubectl -n monitoring get secret prometheus-grafana \
#     -o jsonpath="{.data.admin-password}" | base64 -d
prometheus:
  prometheusSpec:
    # 15 days of metrics is plenty for a starter and keeps disk costs low.
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  enabled: true
  # Admin password is generated by the chart and stored in the
  # `prometheus-grafana` secret — do NOT hardcode a password here.
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 5Gi
  # The dashboard sidecar picks up ConfigMaps labelled grafana_dashboard: "1".
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

# Keep the default ServiceMonitors (kubelet, apiserver, node-exporter,
# kube-state-metrics) — they feed the alerts in alert-rules.yaml.
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
