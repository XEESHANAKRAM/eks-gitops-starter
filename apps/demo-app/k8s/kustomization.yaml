apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  # ingress.yaml is not listed: it needs an ingress controller and a real
  # domain. Apply it manually once those exist (see docs/customization.md).
