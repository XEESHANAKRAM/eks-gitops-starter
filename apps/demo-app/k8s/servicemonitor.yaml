# Tells Prometheus (via the Operator) to scrape /metrics from the demo app.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: monitoring
  labels:
    app: demo-app
spec:
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app: demo-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
